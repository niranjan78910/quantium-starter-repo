name: Sales chart tests
on:
  push:
    branches: [main, portfolio-improvements-2026]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "dash==3.4.0" "pandas==2.2.3" "plotly==6.5.2"
      - name: Run tests
        run: python -m unittest discover -p "test_*.py" -v
